<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refacciones Apex</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Refacciones%20Apex%22%2C%22short_name%22%3A%22Apex%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23D3202A%22%7D">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0F2;--card:#fff;--ink:#14161A;--mut:#69717B;--line:#D9DDE2;--red:#D3202A;--ok:#23864F;--hero:#14161A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1013;--card:#1A1D22;--ink:#ECEEF0;--mut:#99A1AB;--line:#2C3138;--red:#F04A52;--ok:#3FBF78;--hero:#050607}}
:root[data-theme="dark"]{--bg:#0E1013;--card:#1A1D22;--ink:#ECEEF0;--mut:#99A1AB;--line:#2C3138;--red:#F04A52;--ok:#3FBF78;--hero:#050607}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;color:#14161A;border-bottom:3px solid var(--red);display:flex;align-items:center;gap:12px;padding:8px 16px}
header img{height:42px;width:auto}header b{font:700 20px "Barlow Condensed",sans-serif;display:block;line-height:1}header span{font-size:13px;color:#69717B}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font:700 22px "Barlow Condensed",sans-serif;margin:22px 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding:0 0 env(safe-area-inset-bottom,0px)}
nav button{flex:1;position:relative;padding:14px 2px;background:none;border:0;border-top:3px solid transparent;margin-top:-1px;font:600 15px Barlow,sans-serif;color:var(--mut)}
nav button[aria-selected=true]{color:var(--ink);border-top-color:var(--red)}
.n{position:absolute;top:6px;margin-left:4px;background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.hero{background:var(--hero);color:#fff;border-radius:6px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.big{font:700 44px/1 "Barlow Condensed",sans-serif}.hero .m{color:#AEB5BE}
.bar{display:flex;height:14px;border-radius:2px;overflow:hidden;background:#2C3138;margin:12px 0 8px}.bar i{display:block}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:#AEB5BE}
label{display:block;font-weight:600;margin:10px 0 4px}
select,input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.b{padding:11px 14px;border-radius:4px;border:1px solid var(--red);background:var(--red);color:#fff;font:600 16px Barlow,sans-serif;cursor:pointer}
.b.ok{background:var(--ok);border-color:var(--ok)}.b.o{background:none;color:var(--red)}
button:focus-visible,label.shot:focus-within{outline:3px solid var(--red);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:12px}.row .b{flex:1}
.shot{display:grid;place-items:center;gap:6px;min-height:120px;border:2px dashed var(--mut);border-radius:6px;cursor:pointer;text-align:center;font-weight:600;margin:0}
.shot img{width:100%;max-height:260px;object-fit:cover;border-radius:4px}
.pic{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block;margin-bottom:10px;cursor:zoom-in}
.th{width:44px;height:44px;object-fit:cover;border-radius:4px;flex:none;cursor:zoom-in}
.tag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid}
.t-autorizado{color:var(--ok)}.t-rechazado{color:var(--red)}
.flag{color:var(--red);font-weight:600;font-size:14px}.msg{color:var(--red);font-weight:600;margin-top:8px}.okm{color:var(--ok);font-weight:600;margin-top:8px}
pre{overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;font-size:13px;margin:6px 0 0}
.m{color:var(--mut);font-size:14px}
.pr,.hi{display:flex;gap:12px;align-items:center}.pr>div:nth-child(2),.hi>div{flex:1;min-width:0}.pr .b{padding:8px 12px}
.ph{flex:none;width:52px;height:52px;border-radius:4px;background:#14161A;color:#E5313B;display:grid;place-items:center;font:700 20px "Barlow Condensed",sans-serif}
[hidden]{display:none!important}
#sg,#oc{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;overflow:auto}
#oc{align-items:flex-start;padding:16px;z-index:9}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:10px 10px 0 0;padding:16px;box-sizing:border-box;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#pad{width:100%;height:160px;background:#fff;border:1px solid var(--line);border-radius:4px;touch-action:none;display:block}
.paper{background:#fff;color:#14161A;max-width:640px;width:100%;margin:0 auto;padding:18px;border-radius:4px;box-sizing:border-box}
.paper table{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}.paper th,.paper td{text-align:left;padding:6px 4px;border-bottom:1px solid #D9DDE2}.paper th:nth-child(n+3),.paper td:nth-child(n+3){text-align:right}
.hi .b{padding:8px 12px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}label.b{margin:0;text-align:center;display:block}
@media print{header,nav,main,#sg,#lb,.noprint{display:none!important}#oc{position:static;background:none;padding:0;display:block}body{padding:0;background:#fff}}
#lb{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}#lb[hidden]{display:none}#lb img{max-width:100%;max-height:100%;border-radius:4px}
</style><script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

return `<div class="hero"><div class="m">Crédito disponible</div><div class="big">${mx(avail())}</div>
<div class="bar"><i style="background:#8A9099;width:${p(S.used)}"></i><i style="background:#E5313B;width:${p(res())}"></i><i style="background:#fff;width:${p(Math.max(avail(),0))}"></i></div>
<div class="leg"><span>Usado ${mx(S.used)}</span><span style="color:#FF7A82">Por autorizar ${mx(res())}</span><span style="color:#fff">Libre</span><span>Límite ${mx(S.limit)}</span></div></div>`}
function cards(q){q=(q||"").toLowerCase();const l=CAT.filter(c=>(c[0]+c[1]+c[3]).toLowerCase().includes(q));
return l.length?l.map(c=>`<div class="card pr"><div class="ph">${esc(c[3].slice(0,2))}</div><div><b>${esc(c[1])}</b><div class="m">${esc(c[0])} · ${esc(c[3])}</div><div>${mx(c[2])} · <span class="${c[4]<5?"flag":"m"}">${c[4]} en existencia</span></div></div><button class="b" ${ME&&ME.rol==="mecanico"?"":"hidden"} data-k="${esc(c[0])}" onclick="go(this.dataset.k)">Pedir</button></div>`).join(""):`<p class="m">Sin resultados. Agrega el producto abajo.</p>`}
function cat(){return `<label for="q" style="margin-top:0">Buscar producto</label><input id="q" type="search" placeholder="Nombre, SKU o categoría" oninput="$('#g').innerHTML=cards(this.value)">
<h2>Productos (${CAT.length})</h2><div id="g">${cards("")}</div>
<div class="card" ${ME&&ME.rol==="admin"?"":"hidden"}><h2 style="margin-top:0">Agregar producto</h2>
<label for="pn">Nombre</label><input id="pn"><label for="pk">SKU</label><input id="pk">
<label for="pg">Categoría</label><input id="pg" placeholder="Ej. Filtros">
<label for="pp">Precio</label><input id="pp" type="number" min="0" inputmode="decimal">
<label for="ps">Existencia</label><input id="ps" type="number" min="0" inputmode="numeric">
<div class="row"><button class="b" onclick="addp()">Guardar producto</button></div><div class="msg">${esc(S.err)}</div></div>`}
function addp(){const v=i=>$(i).value.trim(),n=v("#pn"),k=v("#pk"),g=v("#pg"),p=parseFloat(v("#pp")),st=parseInt(v("#ps"));
if(!n||!k||!(p>0)){S.err="Falta nombre, SKU o un precio válido.";draw();return}
if(CAT.some(c=>c[0]===k)){S.err="Ese SKU ya existe.";draw();return}
CAT.push([k,n,p,g||"General",st>0?st:0]);S.err="";S.log.unshift("POST /v1/productos → "+k+" creado");save();draw()}
function go(k){S.tab="enc";S.err="";draw();$("#sk").value=k;$("#qt").focus()}
function enc(){return credit()+`<div class="card"><h2 style="margin-top:0">Pedir refacción</h2>
<label for="sk">Refacción</label><select id="sk">${CAT.map(c=>`<option value="${esc(c[0])}">${esc(c[1])} · ${mx(c[2])}</option>`).join("")}</select>
<label for="qt">Cantidad</label><input id="qt" type="number" min="1" value="1" inputmode="numeric">
<label for="nt">Equipo o parcela donde se usará</label><input id="nt" placeholder="Ej. Tractor 7, rancho La Noria">
<div style="font-weight:600;margin:10px 0 4px">Foto de la pieza dañada (obligatoria)</div>
<div class="row" style="margin-top:0"><label class="b" for="ph">Tomar foto</label><label class="b o" for="pf">Elegir de galería</label></div>
${PH?`<img class="pic" src="${PH}" alt="Vista previa" style="margin:10px 0 0;cursor:default">`:`<div class="m" style="margin-top:8px">Aún no hay foto.</div>`}
<input class="vh" id="ph" type="file" accept="image/*" capture="environment" onchange="pick(this)">
<input class="vh" id="pf" type="file" accept="image/*" onchange="pick(this)">
<div class="row"><button class="b" onclick="ask()">Enviar al dueño</button></div>
<div class="msg" id="er">${esc(S.err)}</div><div class="okm">${esc(S.ok)}</div>
<p class="m">Nada se surte hasta que el dueño vea la foto y autorice.</p></div>`}
function pick(inp){const f=inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);
im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
c.getContext("2d").drawImage(im,0,0,c.width,c.height);PH=c.toDataURL("image/jpeg",.6);URL.revokeObjectURL(u);S.err="";S.ok="";
const sk=$("#sk").value,qt=$("#qt").value,nt=$("#nt").value;draw();$("#sk").value=sk;$("#qt").value=qt;$("#nt").value=nt};
im.onerror=()=>{$("#er").textContent="No se pudo leer la imagen. Intenta con otra foto."};im.src=u}
function ask(){const r={id:S.reqs.reduce((a,x)=>Math.max(a,x.id),1041)+1,who:"Luis · mecánico",sku:$("#sk").value,qty:Math.max(1,parseInt($("#qt").value)||1),note:$("#nt").value.trim(),foto:PH,st:"pendiente",t:now()};
const e=$("#er");
if(!PH){e.textContent="Falta la foto de la pieza. Es obligatoria.";return}
if(tot(r)>avail()){e.textContent="Excede el crédito disponible ("+mx(avail())+").";return}
S.reqs.unshift(r);S.log.unshift(`POST /v1/solicitudes → ${r.id} pendiente (con foto)`);PH=null;S.err="";S.ok="Enviado. El dueño recibirá el pedido con la foto.";save();draw()}
let SIGN=null,dr=false,has=false;
function sign(id){const r=S.reqs.find(x=>x.id===id);SIGN=id;has=false;
$("#sgb").innerHTML=`<h2 style="margin-top:0">Firmar orden de compra</h2><div>${esc(item(r.sku)[1])} × ${r.qty}</div><div class="big" style="font-size:34px">${mx(tot(r))}</div>
<label>Firma con el dedo o el mouse</label><canvas id="pad" width="600" height="320"></canvas><div class="msg" id="se"></div>
<div class="row"><button class="b o" onclick="clr()">Limpiar</button><button class="b o" onclick="$('#sg').hidden=true">Cancelar</button></div>
<div class="row"><button class="b ok" onclick="fin()">Firmar y generar orden</button></div>`;
$("#sg").hidden=false;const c=$("#pad"),x=c.getContext("2d");x.lineWidth=5;x.lineCap="round";x.strokeStyle="#14161A";
const pt=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
c.onpointerdown=e=>{dr=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b);x.stroke();has=true};
c.onpointermove=e=>{if(!dr)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
c.onpointerup=()=>{dr=false}}
function clr(){const c=$("#pad");c.getContext("2d").clearRect(0,0,c.width,c.height);has=false}
async function fin(){if(!has){$("#se").textContent="Falta tu firma.";return}
const r=S.reqs.find(x=>x.id===SIGN);r.firma=$("#pad").toDataURL("image/png");r.st="autorizado";r.oc="OC-"+r.id;r.fecha=new Date().toLocaleString("es-MX");S.used+=tot(r);
try{const d=[r.oc,r.sku,r.qty,tot(r),r.fecha,r.firma].join("|"),h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(d));r.hash=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,16)}catch(e){r.hash=""}
S.log.unshift(`POST /v1/solicitudes/${r.id}/aprobar → ${r.oc} firmada, sale.order S0${r.id}`);save();$("#sg").hidden=true;draw();oc(r.id)}
function oc(id){const r=S.reqs.find(x=>x.id===id),it=item(r.sku),lg=$("header img").src;
$("#ocb").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><img src="${lg}" alt="Apex" style="height:40px"><div style="text-align:right"><b style="font:700 24px 'Barlow Condensed',sans-serif">Orden de compra</b><div>${r.oc}</div><div style="font-size:13px;color:#69717B">${esc(r.fecha)}</div></div></div>
<p style="margin:12px 0 0;font-size:14px">Cliente: cuenta AGR-077<br>Solicitó: ${esc(r.who)}${r.note?`<br>Uso: ${esc(r.note)}`:""}</p>
<table><tr><th>SKU</th><th>Descripción</th><th>Cant.</th><th>P. unit.</th><th>Importe</th></tr><tr><td>${esc(it[0])}</td><td>${esc(it[1])}</td><td>${r.qty}</td><td>${mx(it[2])}</td><td>${mx(tot(r))}</td></tr></table>
<div style="text-align:right;font:700 24px 'Barlow Condensed',sans-serif">Total ${mx(tot(r))}</div>
<div style="display:flex;gap:16px;align-items:flex-end;justify-content:space-between;margin-top:14px"><img src="${r.foto}" alt="Foto de la pieza" style="height:90px;border-radius:4px"><div style="text-align:center"><img src="${r.firma}" alt="Firma" style="height:70px;display:block;margin:0 auto"><div style="border-top:1px solid #14161A;padding-top:4px;font-size:13px">Autorizó: dueño</div></div></div>
${r.hash?`<p style="font-size:12px;color:#69717B;word-break:break-all">Huella de verificación: ${r.hash}</p>`:""}
<div class="row noprint"><button class="b" onclick="try{print()}catch(e){}">Imprimir o guardar PDF</button><button class="b o" onclick="$('#oc').hidden=true">Cerrar</button></div>`;$("#oc").hidden=false}
function zoom(id){const r=S.reqs.find(x=>x.id===id);$("#lb img").src=r.foto;$("#lb").hidden=false}
function due(){const p=S.reqs.filter(r=>r.st==="pendiente"),h=S.reqs.filter(r=>r.st!=="pendiente");
return credit()+`<h2>Por autorizar (${p.length})</h2>`+(p.length?p.map(r=>`<div class="card"><img class="pic" src="${r.foto}" alt="Foto de la pieza" onclick="zoom(${r.id})">
<b>${esc(item(r.sku)[1])}</b><div>${r.qty} pza · ${mx(tot(r))}</div><div class="m">${esc(r.who)} · ${r.t}</div>
${r.note?`<div class="m">Uso: ${esc(r.note)}</div>`:`<div class="flag">Sin equipo o parcela indicada</div>`}
<div class="row"><button class="b ok" onclick="sign(${r.id})">Firmar y autorizar</button><button class="b o" onclick="dec(${r.id},0)">Rechazar</button></div></div>`).join(""):`<p class="m">No hay pedidos esperando. El mecánico los envía desde la pestaña Mecánico.</p>`)
+`<h2>Historial</h2>`+(h.length?h.map(r=>`<div class="card hi"><img class="th" src="${r.foto}" alt="Foto" onclick="zoom(${r.id})"><div><span class="tag t-${r.st}">${r.st}</span> ${esc(item(r.sku)[1])} × ${r.qty} · ${mx(tot(r))}${r.oc?`<div class="m">${r.oc} · firmada</div>`:""}</div>${r.oc?`<button class="b o" onclick="oc(${r.id})">Ver orden</button>`:""}</div>`).join(""):`<p class="m">Aún sin movimientos.</p>`)}
function dec(id,ok){const r=S.reqs.find(x=>x.id===id);r.st=ok?"autorizado":"rechazado";
if(ok){S.used+=tot(r);S.log.unshift(`POST /v1/solicitudes/${id}/aprobar → sale.order S0${id} confirmada, foto adjunta`)}
else S.log.unshift(`POST /v1/solicitudes/${id}/rechazar → sin pedido en Odoo`);save();draw()}
function api(){return `<div class="card"><h2 style="margin-top:0">Sincronizar con Odoo</h2>
<p>El mecánico envía el pedido con foto. Solo cuando el dueño firma se genera la orden de compra y se crea el pedido en Odoo, con foto y firma adjuntas. El crédito se lee de Odoo y llega a la app por webhook.</p>
<pre>GET  /v1/clientes/{id}/credito
→ {"limite":250000,"usado":148500,"por_autorizar":${res()},"disponible":${avail()}}

POST /v1/solicitudes  (multipart)
cliente, sku, cantidad, motivo, foto (obligatoria)

POST /v1/solicitudes/{id}/aprobar   (token del dueño)
{"firma_png":"data:image/png;base64,…","huella":"3f9a…"}
→ genera la orden de compra, crea sale.order
  y adjunta foto, firma y PDF

POST /v1/solicitudes/{id}/rechazar
GET  /v1/productos?q=filtro
POST /v1/productos  (alta o cambio de precio y existencia)
POST /v1/webhooks  (credit.updated, payment.received)</pre>
<p class="m"><b>Mapeo Odoo:</b> producto → product.template · existencia → stock.quant · límite → res.partner.credit_limit · usado → saldo de account.move abiertas · pedido → sale.order · orden de compra → client_order_ref · foto, firma y PDF → ir.attachment · pago → account.payment. Autenticación con API key por cliente y firma HMAC en los webhooks.</p></div>
<div class="card"><b>Simular evento de Odoo</b><div class="row"><button class="b" onclick="pay()">Cliente abona $20,000</button></div></div>
<h2>Bitácora de sincronización</h2><div class="card"><pre>${esc(S.log.slice(0,8).join("\n"))}</pre></div>
<div class="row"><button class="b o" onclick="reset()">Reiniciar demo</button></div>`}
function pay(){const a=Math.min(20000,S.used);S.used-=a;S.log.unshift("WEBHOOK payment.received → crédito liberado "+mx(a));save();draw()}
function reset(){try{localStorage.removeItem("apex")}catch(e){}location.reload()}
const T=[["cat","Catálogo"],["enc","Mecánico"],["due","Dueño"],["api","API Odoo"]];
function draw(){const n=S.reqs.filter(r=>r.st==="pendiente").length;$("#v").innerHTML={cat,enc,due,api}[S.tab]();
$("nav").innerHTML=T.map(([k,l])=>`<button role="tab" aria-selected="${k===S.tab}" onclick="S.tab='${k}';S.err='';S.ok='';draw();scrollTo(0,0)">${l}${k==="due"&&n?`<b class="n">${n}</b>`:""}</button>`).join("")}
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);let ME=null;
const TR={mecanico:[["cat","Catálogo"],["enc","Pedir"]],dueno:[["cat","Catálogo"],["due","Autorizar"]],admin:[["cat","Catálogo"]]};
function login(){$("nav").innerHTML="";$("#v").innerHTML=`<div class="card"><h2 style="margin-top:0">Entrar</h2><label for="em">Correo</label><input id="em" type="email" autocomplete="username"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"><div class="row"><button class="b" onclick="signin()">Entrar</button></div><div class="msg" id="le"></div></div>`}
async function signin(){const{error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(error){$("#le").textContent="Correo o contraseña incorrectos.";return}boot()}
async function out(){await sb.auth.signOut();await sb.removeAllChannels();ME=null;login()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){login();return}
const{data:p}=await sb.from("perfiles").select("*").eq("id",session.user.id).maybeSingle();
if(!p){$("#v").innerHTML='<p class="msg">Tu usuario aún no tiene perfil. Pide al administrador que lo active.</p><div class="row"><button class="b o" onclick="out()">Salir</button></div>';return}
ME=p;S.tab=p.rol==="dueno"?"due":p.rol==="mecanico"?"enc":"cat";await load();draw();
await sb.removeAllChannels();sb.channel("rt").on("postgres_changes",{event:"*",schema:"public"},async()=>{await load();const a=document.activeElement.tagName;if(a!=="INPUT"&&a!=="SELECT")draw()}).subscribe()}
async function load(){const[c,pr,so]=await Promise.all([ME.cliente_id?sb.from("clientes").select("*").eq("id",ME.cliente_id).maybeSingle():{data:null},sb.from("productos").select("*").order("nombre"),sb.from("solicitudes").select("*,perfiles(nombre)").order("creado",{ascending:false}).limit(100)]);
const rows=so.data||[],{data:u}=await sb.storage.from("fotos").createSignedUrls(rows.map(r=>r.foto_path),3600),m={};(u||[]).forEach(x=>m[x.path]=x.signedUrl);
CAT=(pr.data||[]).map(p=>[p.sku,p.nombre,Number(p.precio),p.categoria,p.existencia]);
S.limit=Number(c.data?.limite||0);S.used=Number(c.data?.usado||0);
S.reqs=rows.filter(r=>item(r.sku)).map(r=>({id:r.id,who:(r.perfiles?.nombre||"Mecánico")+" · mecánico",sku:r.sku,qty:r.cantidad,note:r.nota||"",foto:m[r.foto_path]||"",st:r.estado,t:new Date(r.creado).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}),firma:r.firma,oc:r.folio,hash:r.huella,fecha:r.resuelto_en?new Date(r.resuelto_en).toLocaleString("es-MX"):""}))}
async function ask(){const e=$("#er"),sku=$("#sk").value,qty=Math.max(1,parseInt($("#qt").value)||1),note=$("#nt").value.trim();
if(!PH){e.textContent="Falta la foto de la pieza. Es obligatoria.";return}
if(item(sku)[2]*qty>avail()){e.textContent="Excede el crédito disponible ("+mx(avail())+").";return}
e.textContent="Enviando…";const path=`${ME.cliente_id}/${crypto.randomUUID()}.jpg`,blob=await (await fetch(PH)).blob();
const up=await sb.storage.from("fotos").upload(path,blob,{contentType:"image/jpeg"});
if(up.error){e.textContent="No se pudo subir la foto. Intenta de nuevo.";return}
const ins=await sb.from("solicitudes").insert({cliente_id:ME.cliente_id,mecanico_id:ME.id,sku,cantidad:qty,nota:note,foto_path:path});
if(ins.error){e.textContent="No se pudo enviar el pedido. Intenta de nuevo.";return}
PH=null;S.err="";S.ok="Enviado. El dueño recibirá el pedido con la foto.";await load();draw()}
async function fin(){if(!has){$("#se").textContent="Falta tu firma.";return}
const r=S.reqs.find(x=>x.id===SIGN),firma=$("#pad").toDataURL("image/png"),folio="OC-"+r.id;let h="";
try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode([folio,r.sku,r.qty,tot(r),firma].join("|")));h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,16)}catch(e){}
const{error}=await sb.rpc("aprobar_solicitud",{p_id:r.id,p_firma:firma,p_huella:h,p_folio:folio});
if(error){$("#se").textContent=error.message.includes("credito")?"El crédito no alcanza para esta orden.":"No se pudo autorizar. Intenta de nuevo.";return}
$("#sg").hidden=true;await load();draw();oc(r.id)}
async function dec(id){await sb.rpc("rechazar_solicitud",{p_id:id});await load();draw()}
async function addp(){const v=i=>$(i).value.trim(),n=v("#pn"),k=v("#pk"),g=v("#pg"),p=parseFloat(v("#pp")),st=parseInt(v("#ps"));
if(!n||!k||!(p>0)){S.err="Falta nombre, SKU o un precio válido.";draw();return}
const{error}=await sb.from("productos").insert({sku:k,nombre:n,precio:p,categoria:g||"General",existencia:st>0?st:0});
if(error){S.err=error.code==="23505"?"Ese SKU ya existe.":"No se pudo guardar el producto.";draw();return}
S.err="";await load();draw()}
function draw(){const n=S.reqs.filter(r=>r.st==="pendiente").length;
$("#v").innerHTML={cat,enc,due}[S.tab]()+`<div class="row"><button class="b o" onclick="out()">Salir (${esc(ME.nombre)})</button></div>`;
$("nav").innerHTML=TR[ME.rol].map(([k,l])=>`<button role="tab" aria-selected="${k===S.tab}" onclick="S.tab='${k}';S.err='';S.ok='';draw();scrollTo(0,0)">${l}${k==="due"&&n?`<b class="n">${n}</b>`:""}</button>`).join("")}
boot();
</script></body></html>
